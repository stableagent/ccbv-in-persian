{% extends "base.html" %}

{% load i18n %}

{% block content %}
    <div class="span12">
        <div class="http-error">
            <h1 class="http-error-number">
                404
            </h1>
            <p class="http-error-message">
                {% url 'home' as home_url %}
                {% blocktrans trimmed %}The page you are looking for can't be found. Try our <a href="{{ home_url }}">Homepage</a>.{% endblocktrans %}
            </p>
        </div>
    </div>
{% endblock content %}
